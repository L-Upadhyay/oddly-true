<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5f0">
    <meta name="description" content="Three bizarre claims. One is oddly true. Play Solo or with friends on separate devices.">
    <title>Oddly True — a bizarre fact party game</title>
    <script>
      document.documentElement.dataset.theme = 'light';
    </script>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/assets/theme.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main id="app" class="app-shell"></main>
    <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title">
      <form method="dialog"><button class="share-close" type="submit" aria-label="Close sharing options">×</button></form>
      <span class="eyebrow">Invite your friends</span>
      <h2 id="share-title">Share this room</h2>
      <p>Send this link however you like. Your friends can join from their own devices.</p>
      <label class="field" for="share-url">Invite link</label>
      <div class="share-link-row"><input id="share-url" class="text-input" type="text" readonly><button id="share-copy" class="primary" type="button">Copy link</button></div>
      <button id="share-native" class="secondary share-native" type="button" hidden>More sharing options</button>
    </dialog>
    <div id="reactions" class="reaction-tray" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
