<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5f0">
    <meta name="description" content="Three bizarre claims. One is oddly true. Play Solo or with friends on separate devices.">
    <title>Oddly True — a bizarre fact party game</title>
    <script>
      try {
        const saved = localStorage.getItem('oddly-true-theme');
        const mode = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#121b19' : '#f8f5f0';
      } catch {
        const mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#121b19' : '#f8f5f0';
      }
    </script>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/assets/theme.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main id="app" class="app-shell"></main>
    <div id="reactions" class="reaction-tray" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
