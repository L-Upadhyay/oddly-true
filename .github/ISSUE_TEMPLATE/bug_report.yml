name: Bug report
description: Report a reproducible problem in Oddly True
title: "[Bug]: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include solo/teams, round mode and host/player role. Do not include seat tokens.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on MacBook Air; Chrome on Android
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional details
      description: Remove tokens and unrelated personal information before attaching.
